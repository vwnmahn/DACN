spring.application.name=DACN
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/dacn?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=
jwt.expiration=600000
jwt.refresh-expiration=604800000

app.upload.avatar-dir=${AVATAR_DIR:uploads/avatars}
app.upload.avatar-url=${AVATAR_URL:/images/avatars/}
app.upload.avatar-max-size=${AVATAR_MAX_SIZE:5242880}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

social.google.client-id=
social.facebook.app-id=
social.facebook.app-secret=

vnpay.tmn-code=
vnpay.hash-secret=
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=
vnpay.payment-timeout-minutes=15
vnpay.transaction-url=${VNPAY_TRANSACTION_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.connect-timeout-seconds=${VNPAY_CONNECT_TIMEOUT_SECONDS:5}
vnpay.read-timeout-seconds=${VNPAY_READ_TIMEOUT_SECONDS:10}

app.order-management.confirmation-timeout=10m
app.order-management.scheduler-batch-size=100
app.order-management.payment-pending-timeout=15m
app.order-management.scheduler-delay-ms=30000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
