spring.datasource.url=jdbc:h2:mem:dacn_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=test-only-jwt-signing-key-with-at-least-32-bytes
jwt.expiration=600000
jwt.refresh-expiration=604800000

social.google.client-id=
social.facebook.app-id=
social.facebook.app-secret=

vnpay.tmn-code=TESTCODE
vnpay.hash-secret=test-only-vnpay-secret
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=https://merchant.test/api/v1/payments/vnpay/return
vnpay.payment-timeout-minutes=15
vnpay.transaction-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.connect-timeout-seconds=1
vnpay.read-timeout-seconds=1

app.order-management.confirmation-timeout=10m
app.order-management.scheduler-batch-size=100
app.order-management.payment-pending-timeout=15m
app.order-management.scheduler-delay-ms=3600000
app.order-management.scheduler-enabled=false

app.cors.allowed-origins=http://localhost:3000
logging.level.root=WARN
